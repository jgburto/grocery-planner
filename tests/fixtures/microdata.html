<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Old-School Microdata Chili</title>
</head>
<body>
<div itemscope itemtype="https://schema.org/Recipe">
  <h1 itemprop="name">Old-School Microdata Chili</h1>
  <span itemprop="recipeYield">6 servings</span>
  <ul>
    <li itemprop="recipeIngredient">1 lb ground beef</li>
    <li itemprop="recipeIngredient">1 can kidney beans</li>
    <li itemprop="recipeIngredient">1 can diced tomatoes</li>
    <li itemprop="recipeIngredient">1 tbsp chili powder</li>
  </ul>
  <div itemprop="recipeInstructions">
    <ol>
      <li>Brown the ground beef in a large pot.</li>
      <li>Add the beans, tomatoes, and chili powder.</li>
      <li>Simmer for 30 minutes, stirring occasionally.</li>
    </ol>
  </div>
</div>
</body>
</html>
