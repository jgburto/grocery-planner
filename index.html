<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Grocery Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,650&family=Public+Sans:wght@400;500;550;600;650;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />

<!-- PWA / iPhone home-screen support -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#4a7c59" />
<link rel="icon" href="icons/icon-192.png" type="image/png" />

<!-- iOS-specific: makes "Add to Home Screen" behave like a real app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Grocery" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
</head>
<body>
  <header class="app-header">
    <h1>
      <svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Grocery Planner
    </h1>
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-tab="menu">Weekly Menu</button>
      <button class="tab-btn" data-tab="bank">Meal Bank</button>
      <button class="tab-btn" data-tab="list">Grocery List</button>
      <button class="tab-btn" data-tab="history">History</button>
    </nav>
  </header>

  <main id="app"></main>

  <!-- Modal for editing/adding a meal -->
  <div id="meal-modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <h2 id="meal-modal-title">Add Meal</h2>
      <form id="meal-form">
        <label>Name
          <input type="text" id="meal-name" required />
        </label>
        <label>Category
          <select id="meal-category" required></select>
        </label>
        <label>Cuisine tag (optional)
          <input type="text" id="meal-cuisine" placeholder="e.g. Mexican" />
        </label>
        <div class="ingredients-editor">
          <div class="ingredients-header">
            <span>Ingredients</span>
            <button type="button" id="add-ingredient-row">+ Add ingredient</button>
          </div>
          <div id="ingredient-rows"></div>
        </div>
        <label>Instructions (optional, one step per line)
          <textarea id="meal-instructions" rows="6" placeholder="One step per line"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="meal-modal-cancel" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Meal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="seed.js"></script>
  <script src="shelflife.js"></script>
  <script src="recipe-import.js"></script>
  <script src="week-utils.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW registration failed", e));
      });
    }
  </script>
</body>
</html>
